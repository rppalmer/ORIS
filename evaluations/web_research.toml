version = 3
specialist = "web_research"

[[cases]]
id = "langgraph-purpose"
category = "official-documentation"
question = "What is LangGraph designed to do, and when should a developer use it?"
evaluation_goal = "Use primary documentation and clearly explain the framework's purpose."

[[cases]]
id = "checkpoint-versus-store"
category = "technical-comparison"
question = "What is the difference between a LangGraph checkpointer and a LangGraph store?"
evaluation_goal = "Compare the two responsibilities without treating them as interchangeable."

[[cases]]
id = "sqlite-wal-concurrency"
category = "multi-source-synthesis"
question = "How does SQLite WAL mode affect concurrent readers and writers, and what is one important limitation?"
evaluation_goal = "Synthesize a precise answer from authoritative technical sources."

[[cases]]
id = "current-python-312-release"
category = "time-sensitive-fact"
question = "What is the most recent release in the Python 3.12 series, including security-only releases? When was it published, and what kind of release is it?"
# Version 2 named 3.12.13 and 3 March 2026 as the right answer. By August the
# answer was 3.12.14 and the case was failing for being out of date rather than
# for anything the specialist did. A case whose expected fact expires is a case
# that quietly stops testing. The goal now describes the shape of a good answer,
# which does not expire.
evaluation_goal = "Give the specific release number, its publication date, and whether it is a full or source-only security release, each attributed to an official Python source. A version with no date, a date with no release type, or a third-party tracker cited where python.org would do, does not answer this."

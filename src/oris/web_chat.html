<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORIS</title>
<!-- Links in an answer open beside the conversation rather than replacing it. -->
<base target="_blank">
<style>
  :root {
    color-scheme: light dark;
    --page: #fbfaf8;
    --surface: #f0eee9;
    --text: #1f1e1b;
    --muted: #6f6c64;
    --line: #dedbd3;
    --accent: #2f6b5e;
    --on-accent: #ffffff;
    --error: #a33a2c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #191a1b;
      --surface: #27292b;
      --text: #e9e7e2;
      --muted: #9b988f;
      --line: #393b3e;
      --accent: #7cc4b2;
      --on-accent: #12211d;
      --error: #ef9a8c;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: var(--page);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 0.7rem 1rem;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: 0.08em; }
  nav { display: flex; gap: 1rem; flex: 1; }
  nav span {
    color: var(--text);
    font-size: 0.95rem;
    box-shadow: 0 2px 0 var(--accent);
  }
  .new-chat {
    color: var(--muted);
    font-size: 0.9rem;
    text-decoration: none;
    padding: 0.2rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .new-chat:hover { color: var(--text); border-color: var(--muted); }

  main { flex: 1; overflow-y: auto; }
  #log {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    max-width: 46rem;
    margin: 0 auto;
    padding: 1.5rem 1rem;
  }
  #empty { color: var(--muted); text-align: center; margin-top: 18vh; }

  .you {
    align-self: flex-end;
    max-width: 85%;
    padding: 0.5rem 0.9rem;
    border-radius: 1rem;
    background: var(--surface);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .oris { overflow-wrap: anywhere; }
  .error { color: var(--error); }
  .thinking { color: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .thinking { animation: none; } }

  .oris > :first-child { margin-top: 0; }
  .oris > :last-child { margin-bottom: 0; }
  .oris h1, .oris h2, .oris h3 { line-height: 1.3; margin: 1.3em 0 0.5em; }
  .oris h1 { font-size: 1.35rem; }
  .oris h2 { font-size: 1.2rem; }
  .oris h3 { font-size: 1.05rem; }
  .oris a { color: var(--accent); }
  .oris code {
    font-family: var(--mono);
    font-size: 0.88em;
    padding: 0.1em 0.3em;
    border-radius: 0.3em;
    background: var(--surface);
  }
  .oris pre {
    padding: 0.8rem 1rem;
    border-radius: 0.6rem;
    background: var(--surface);
    overflow-x: auto;
  }
  .oris pre code { padding: 0; background: none; }
  .oris blockquote {
    margin: 1em 0;
    padding-left: 1em;
    border-left: 3px solid var(--line);
    color: var(--muted);
  }
  .oris table { display: block; overflow-x: auto; border-collapse: collapse; }
  .oris th, .oris td {
    padding: 0.35rem 0.8rem;
    border: 1px solid var(--line);
    text-align: left;
    overflow-wrap: normal;
  }
  .oris th { background: var(--surface); }

  form {
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
    padding: 0.5rem 1rem 1rem;
  }
  textarea {
    flex: 1;
    max-height: 12rem;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    background: var(--page);
    color: var(--text);
    font: inherit;
    resize: none;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 0.6rem 1.1rem;
    border: none;
    border-radius: 0.9rem;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="brand">ORIS</div>
  <nav><span aria-current="page">Chat</span></nav>
  <a class="new-chat" href="/" target="_self">New chat</a>
</header>
<main>
  <div id="log" aria-live="polite">
    <p id="empty" hidden>Ask anything.</p>
  </div>
</main>
<form>
  <textarea rows="1" placeholder="Message ORIS" aria-label="Message ORIS" autofocus></textarea>
  <button>Send</button>
</form>
<script>
  const address = `/api/chat/${location.pathname.split("/").pop()}`;
  const scroller = document.querySelector("main");
  const log = document.querySelector("#log");
  const empty = document.querySelector("#empty");
  const form = document.querySelector("form");
  const box = document.querySelector("textarea");
  const send = document.querySelector("button");

  function add(className, fill) {
    const element = document.createElement("div");
    element.className = className;
    fill(element);
    empty.hidden = true;
    log.append(element);
    return element;
  }

  // Requests are the reader's own text, so they go in as text. Answers arrive
  // as HTML the server has already made safe.
  const addRequest = (text) => add("you", (el) => { el.textContent = text; });
  const addAnswer = (html) => add("oris", (el) => { el.innerHTML = html; });
  const addError = (text) => add("error", (el) => { el.textContent = text; });
  const toBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

  function fitBox() {
    box.style.height = "auto";
    box.style.height = `${box.scrollHeight + 2}px`;
  }

  async function load() {
    const { messages } = await (await fetch(address)).json();
    for (const message of messages) {
      if (message.role === "you") addRequest(message.text);
      else addAnswer(message.html);
    }
    empty.hidden = messages.length > 0;
    toBottom();
  }

  async function submit() {
    const text = box.value.trim();
    if (!text || send.disabled) return;
    box.value = "";
    fitBox();
    send.disabled = true;
    addRequest(text);
    const thinking = add("thinking", (el) => { el.textContent = "Thinking…"; });
    toBottom();

    let failure;
    try {
      const response = await fetch(address, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const body = await response.json().catch(() => ({}));
      if (response.ok) {
        // A long answer is read from its first line, not its last.
        addAnswer(body.html).scrollIntoView({ block: "start" });
      } else {
        failure = body.error || `The request failed (${response.status}).`;
      }
    } catch {
      failure = "Could not reach ORIS.";
    }
    thinking.remove();
    if (failure) {
      addError(failure);
      // A failed request is not kept in the conversation, so hand it back.
      box.value = text;
      fitBox();
      toBottom();
    }
    send.disabled = false;
    box.focus();
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    submit();
  });
  box.addEventListener("input", fitBox);
  box.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      submit();
    }
  });

  load();
</script>
</body>
</html>
